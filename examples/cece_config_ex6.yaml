# =====================================================================
# CECE Example 6: Multi-Stream Multi-Source Addition
# =====================================================================
# This example tests multi-stream emissions blending, merging multiple
# anthropogenic sectors (such as EDGAR and CEDS datasets) using additive
# and scaling operators.
#
# Key Features Tested:
#   - Additive emissions stream operations for a single target species.
#   - Dynamic temporal and spatial remapping of disparate datasets.
#   - Fast testing rectilinear grid configuration.
# =====================================================================
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-01T04:00:00"
  timestep_seconds: 3600
  grid:
    nx: 4
    ny: 4
    lon_min: -135.0
    lon_max: 135.0
    lat_min: -67.5
    lat_max: 67.5

species:
  no:
    - field: "EDGAR_NO_POW"
      category: "anthropogenic"
      operation: "add"
    - field: "CEDS_NO_AGR"
      category: "anthropogenic"
      operation: "add"

cece_data:
  streams:
    - name: "EDGAR_NO_POW"
      file: "/work/data/EDGAR_v43.NOx.POW.nc"
      cadence: "monthly"
      yearAlign: 2020 # Simulation year 2020 aligns to the first file year
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "NOx_POW"
          model: "EDGAR_NO_POW"
    - name: "CEDS_NO_AGR"
      file: "/work/data/ALK4_butanes-em-total-anthro_CEDS_1970.nc"
      cadence: "monthly"
      yearAlign: 2020 # Simulation year 2020 aligns to the 1970 file year
      taxmode: "extend" # Hold the file's end values outside its coverage
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "ALK4_butanes"
          model: "CEDS_NO_AGR"

diagnostics:
  output_interval_seconds: 3600
  variables: ["no"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex6_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: "no"
      attributes:
        units: "kg m-2 s-1"
        long_name: "nitrogen_monoxide_emission_flux"
