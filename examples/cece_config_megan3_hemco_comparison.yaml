# CECE MEGAN3 ISOP diagnostic comparison with the source-derived HEMCO 3.12.1
# stateless isoprene calculation. This template does not run HEMCO and does not
# establish MEGAN3 parity. Replace all /path/to values.

driver:
  start_time: "2021-06-20T12:00:00"
  end_time: "2021-06-20T13:00:00"
  timestep_seconds: 3600
  amio_staging_buffer_count: 8
  gridspec_file: "/path/to/hemco_4x5_gridspec.nc"
  grid:
    nx: 72
    ny: 46
    nz: 1

physics_schemes:
  - name: megan3
    language: cpp
    options:
      mechanism_file: data/speciation/spc_cb6.yaml
      speciation_file: data/speciation/map_cb6.yaml
      speciation_dataset: MEGAN
      co2_concentration: 390.0
      co2_method: possell
      emission_classes:
        ISOP:
          ldf: 0.9996
          ct1: 95.0
          cleo: 2.0
          beta: 0.13
          anew: 0.05
          agro: 0.6
          amat: 1.0
          aold: 0.9
          # MEGAN3 AEF is an amount flux. Multiplication by the configured
          # 68.12 kg kmol-1 ISOP molecular weight gives the same 1.0e-9
          # kg m-2 s-1 effective AEF used by the source-reference path below.
          default_aef: 1.4679976512037582e-11

  - name: megan
    language: cpp
    options:
      megan_method: hemco_3_12_1
      aef: 1.0e-9
      export_field_name: isoprene_hemco_source_reference
      hemco_co2_inhibition: true
      hemco_co2_ppm: 390.0
      hemco_par_direct_history_wm2: 30.0
      hemco_par_diffuse_history_wm2: 48.0
      hemco_temperature_history_k: 288.15
      hemco_day_of_year: 171

cece_data:
  streams:
    - name: "MEGAN_MET_4X5"
      file: "/path/to/megan_met_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: T2M, model: temperature }
        - { file: PARDR, model: par_direct }
        - { file: PARDF, model: par_diffuse }
        - { file: SUNCOS, model: solar_cosine }
    - name: "MEGAN_LAI_4X5"
      file: "/path/to/megan_lai_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: LAI, model: leaf_area_index }
        - { file: LAI_PREV, model: leaf_area_index_prev }

output:
  enabled: true
  directory: "./output"
  filename_pattern: "cece_megan3_source_comparison_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: MEGAN_ISOP
      attributes:
        units: "kg m-2 s-1"
    - name: isoprene_hemco_source_reference
      attributes:
        units: "kg m-2 s-1"
