# =====================================================================
# CECE MEGAN3 multi-species vs HEMCO 3.12.1 isoprene comparison
# =====================================================================
# Runs the full MEGAN3 multi-species scheme alongside the HEMCO 3.12.1
# parity scheme to validate the ISOP class of MEGAN3 against the
# validated HEMCO reference.
#
# MEGAN3 ISOP class output is compared against the hemco_3_12_1 emission
# after applying the CB6 speciation weights for isoprene.
#
# See docs/hemco_megan_parity.md for full comparison instructions.
# =====================================================================

driver:
  start_time: "2021-06-20T00:00:00"
  end_time: "2021-06-20T23:00:00"
  timestep_seconds: 3600
  grid:
    nx: 72
    ny: 46
    lon_min: -180.0
    lon_max: 175.0
    lat_min: -90.0
    lat_max: 90.0
  output:
    file: "cece_megan3_hemco_comparison.nc"
    variables:
      - name: ISOP
        units: "kg m-2 s-1"
      - name: isoprene_hemco3121
        units: "kg m-2 s-1"

physics_schemes:
  # --- Full MEGAN3 multi-species biogenic scheme ---
  - name: megan3
    language: cpp
    options:
      mechanism_file: data/speciation/spc_cb6.yaml
      speciation_file: data/speciation/map_cb6.yaml
      speciation_dataset: MEGAN
      co2_concentration: 390.0
      co2_method: possell
      emission_classes:
        ISOP:
          ldf: 0.9996
          ct1: 95.0
          cleo: 2.0
          beta: 0.13
          anew: 0.05
          agro: 0.6
          amat: 1.0
          aold: 0.9
          default_aef: 1.0e-9
    input_mapping:
      temperature: TSFC
      leaf_area_index: LAI
      leaf_area_index_prev: LAI_PREV
      par_direct: PARDR
      par_diffuse: PARDF
      solar_cosine: SUNCOS

  # --- HEMCO 3.12.1 stateless MEGAN parity reference ---
  - name: megan
    language: cpp
    options:
      megan_method: hemco_3_12_1
      aef: 1.0e-9
      hemco_co2_ppm: 390.0
      hemco_par_avg_umol: 400.0
      hemco_t_avg_15_k: 297.0
      export_field_name: isoprene_hemco3121
    input_mapping:
      temperature: TSFC
      leaf_area_index: LAI
      leaf_area_index_prev: LAI_PREV
      par_direct: PARDR
      par_diffuse: PARDF
      solar_cosine: SUNCOS
    output_mapping:
      isoprene_hemco3121: ISOP_HEMCO3121

cece_data:
  streams:
    - name: "MERRA2_MET"
      file: "/path/to/MERRA2/MERRA2.20210620.A1.4x5.nc4"
      yearFirst: 2021
      yearLast: 2021
      variables:
        - model: TSFC
          file: T2M
        - model: PARDR
          file: PARDR
        - model: PARDF
          file: PARDF
        - model: SUNCOS
          file: SUNCOS

    - name: "MEGAN_LAI"
      file: "/path/to/MEGAN/lai.geos.1x1.nc"
      yearFirst: 2000
      yearLast: 2000
      variables:
        - model: LAI
          file: LAI
        - model: LAI_PREV
          file: LAI_PREV
