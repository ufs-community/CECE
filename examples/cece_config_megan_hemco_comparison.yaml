# =====================================================================
# CECE MEGAN native vs HEMCO 3.12.1 isoprene comparison
# =====================================================================
# Runs both the CECE native MEGAN scheme and the HEMCO 3.12.1 parity
# scheme in a single simulation so that outputs can be differenced
# cell-by-cell.
#
# HEMCO 3.12.1 key differences from CECE native MEGAN defaults:
#   - PTOA: 2650+130·cos (HEMCO) vs 3000+99·cos (CECE)
#   - PAR_AVG: 400 µmol/m²/s direct (HEMCO) vs 400 W/m²×4.766 (CECE)
#   - DOY_offset: 18 (HEMCO) vs 10 (CECE)
#   - CO₂: 390 ppm (HEMCO reference) vs user-configurable (CECE)
#
# Outputs:
#   isoprene_native    — CECE native MEGAN emission [kg m⁻² s⁻¹]
#   isoprene_hemco3121 — HEMCO 3.12.1 parity emission [kg m⁻² s⁻¹]
#
# Post-processing: scripts/compare_megan_hemco_parity.py
# See docs/hemco_megan_parity.md for full instructions.
# =====================================================================

driver:
  start_time: "2021-06-20T00:00:00"
  end_time: "2021-06-20T23:00:00"
  timestep_seconds: 3600
  grid:
    nx: 72
    ny: 46
    lon_min: -180.0
    lon_max: 175.0
    lat_min: -90.0
    lat_max: 90.0
  output:
    file: "cece_megan_comparison.nc"
    variables:
      - name: isoprene_native
        units: "kg m-2 s-1"
      - name: isoprene_hemco3121
        units: "kg m-2 s-1"

physics_schemes:
  # --- CECE native MEGAN (CECE 2024 defaults) ---
  - name: megan
    language: cpp
    options:
      megan_method: native
      co2_concentration: 390.0 # Match CO₂ to HEMCO reference for isolation
      aef: 1.0e-9
      ldf: 0.9996
      beta: 0.13
      ct1: 95.0
      ceo: 2.0
      anew: 0.05
      agro: 0.6
      amat: 1.0
      aold: 0.9
      export_field_name: isoprene_native
    input_mapping:
      temperature: TSFC
      leaf_area_index: LAI
      leaf_area_index_prev: LAI_PREV
      par_direct: PARDR
      par_diffuse: PARDF
      solar_cosine: SUNCOS
    output_mapping:
      isoprene_native: ISOP_NATIVE

  # --- HEMCO 3.12.1 stateless parity ---
  - name: megan
    language: cpp
    options:
      megan_method: hemco_3_12_1
      aef: 1.0e-9
      hemco_co2_ppm: 390.0
      hemco_par_avg_umol: 400.0
      hemco_t_avg_15_k: 297.0
      export_field_name: isoprene_hemco3121
    input_mapping:
      temperature: TSFC
      leaf_area_index: LAI
      leaf_area_index_prev: LAI_PREV
      par_direct: PARDR
      par_diffuse: PARDF
      solar_cosine: SUNCOS
    output_mapping:
      isoprene_hemco3121: ISOP_HEMCO3121

cece_data:
  streams:
    - name: "MERRA2_MET"
      file: "/path/to/MERRA2/MERRA2.20210620.A1.4x5.nc4"
      yearFirst: 2021
      yearLast: 2021
      variables:
        - model: TSFC
          file: T2M
        - model: PARDR
          file: PARDR
        - model: PARDF
          file: PARDF
        - model: SUNCOS
          file: SUNCOS

    - name: "MEGAN_LAI"
      file: "/path/to/MEGAN/lai.geos.1x1.nc"
      yearFirst: 2000
      yearLast: 2000
      variables:
        - model: LAI
          file: LAI
        - model: LAI_PREV
          file: LAI_PREV
