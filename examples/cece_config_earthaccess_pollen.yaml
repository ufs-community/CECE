# =====================================================================
# CECE Pollen Example: RF Climatology + Earthaccess MERRA-2 Meteorology
# =====================================================================
# Prerequisites:
#   python -m pip install -e '.[cloud,pollen]'
#   export EARTHDATA_TOKEN=<NASA-Earthdata-token>
#   # Or configure ~/.netrc as documented in docs/examples.md.
#
# Generate the annual source climatology first (docs/pollen.md):
#   data/pollen/annual_pollen_production_mugwort_2025.nc
# via tools/prepare_global_pollen_rf.py download-merra2/aggregate-merra2 and
# download-ambee (data/pollen/pollen_sites_global.csv is a ready-made global
# site list; use --timestamp-path timestamp and the --count-path documented
# for your own Ambee account response, not the tool's updatedAt default).
#
# The RF file supplies the annual pollen pool. MERRA-2 meteorology is streamed
# at each CECE timestep and controls Gaussian-pool mobilization online.
# =====================================================================

driver:
  start_time: "2025-08-25T00:00:00"
  end_time: "2025-08-26T00:00:00"
  timestep_seconds: 3600
  log_file: "./logs/cece_earthaccess_pollen.log"
  earthaccess_helper: "../scripts/cece_earthaccess_standalone_ingest.py"
  amio_worker_threads: 1
  amio_staging_buffer_count: 8
  grid:
    nx: 576
    ny: 361
    nz: 1
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

# Empty layers advertise physics-owned inert CTM tracer outputs.
species:
  POLLEN_MUGWORT_NUM: []
  POLLEN_MUGWORT_MASS: []
  POLLEN_MUGWORT_DIAMETER: []
  POLLEN_MUGWORT_DENSITY: []

physics_schemes:
  - name: pollen_artemisia
    language: cpp
    refresh_interval_seconds: 3600
    options:
      phenology_method: rssig
      season_start_doy: 215.0
      season_end_doy: 280.0
      gaussian_width: 4.0
      # The trained source climatology is already vegetation-masked.
      vegetation_fraction_default: 1.0
      particle_diameter_um: 22.0
      particle_density_kg_m3: 1100.0
      precipitation_low_mm_interval: 1.0e-5
      precipitation_high_mm_interval: 1.0
      input_mapping:
        day_of_year: DAY_OF_YEAR
        annual_pollen_production: RF_MUGWORT_PANNUAL
        wind_speed: MERRA2_WIND_SPEED
        # USTAR is a turbulence proxy; replace it with a diagnosed convective
        # velocity scale when the driving system provides one.
        convective_velocity: MERRA2_USTAR
        precipitation: MERRA2_PRECIP_MM_INTERVAL
        relative_humidity: MERRA2_RH2M
        temperature: MERRA2_T2M
        sunshine_hours: SUNSHINE_HOURS
      output_mapping:
        pollen_number_emissions: POLLEN_MUGWORT_NUM
        pollen_mass_emissions: POLLEN_MUGWORT_MASS
        pollen_diameter: POLLEN_MUGWORT_DIAMETER
        pollen_density: POLLEN_MUGWORT_DENSITY

cece_data:
  streams:
    # Annual RF production climatology generated by tools/train_pollen_rf.py.
    - name: MUGWORT_RF_CLIMATOLOGY_2025
      file: "data/pollen/annual_pollen_production_mugwort_2025.nc"
      yearFirst: 2025
      yearLast: 2025
      yearAlign: 2025
      taxmode: extend
      tintalgo: nearest
      mapalgo: bilinear
      variables:
        - file: annual_pollen_production
          model: RF_MUGWORT_PANNUAL

    # Temperature, humidity inputs, and timestamp-derived phenology fields.
    - name: MERRA2_POLLEN_STATE
      source: earthaccess
      short_name: M2T1NXSLV
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        T2M: MERRA2_T2M
        QV2M:
          model: MERRA2_QV2M
          fill_value: 0.0
        PS: MERRA2_PS
      derived_variables:
        DAY_OF_YEAR: day_of_year
        SUNSHINE_HOURS: sunshine_hours
        MERRA2_RH2M:
          method: relative_humidity
          temperature: T2M
          specific_humidity: QV2M
          pressure: PS

    # Surface wind, turbulence proxy, and hourly precipitation accumulation.
    - name: MERRA2_POLLEN_FLUX
      source: earthaccess
      short_name: M2T1NXFLX
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        SPEED: MERRA2_WIND_SPEED
        USTAR: MERRA2_USTAR
        PRECTOTCORR:
          model: MERRA2_PRECIP_MM_INTERVAL
          # MERRA-2 PRECTOTCORR is kg m-2 s-1 == mm s-1. The pollen
          # physics interval is one hour, so convert rate to mm interval-1.
          scale: 3600.0

output:
  enabled: true
  directory: "./output/earthaccess_pollen"
  filename_pattern: "cece_earthaccess_pollen_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  amio_worker_threads: 2
  amio_staging_buffer_count: 2
  amio_staging_buffer_capacity_bytes: 67108864
  amio_staging_timeout_ms: 60000
  fields:
    - name: POLLEN_MUGWORT_NUM
      attributes:
        units: "grains m-2 s-1"
        long_name: "mugwort pollen number emission flux"
        ctm_role: "inert_primary_coarse_pm"
    - name: POLLEN_MUGWORT_MASS
      attributes:
        units: "kg m-2 s-1"
        long_name: "mugwort pollen mass emission flux"
        ctm_species: "POLLEN_MUGWORT"
    - name: POLLEN_MUGWORT_DIAMETER
      attributes:
        units: "m"
        long_name: "mugwort pollen geometric diameter"
    - name: POLLEN_MUGWORT_DENSITY
      attributes:
        units: "kg m-3"
        long_name: "mugwort pollen particle density"
  global_attributes:
    title: "CECE pollen driven by RF climatology and Earthaccess MERRA-2 meteorology"
