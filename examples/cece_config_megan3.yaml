cece_data:
  streams:
    - name: MEGAN_MET
      file: "/path/to/megan_met_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: T2M, model: temperature }
        - { file: PARDR, model: par_direct }
        - { file: PARDF, model: par_diffuse }
        - { file: COSZS, model: solar_cosine }
        - { file: GWETROOT, model: soil_moisture_root }
        - { file: U10M, model: wind_speed }
    - name: MEGAN_LAI
      file: "/path/to/megan_lai_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: LAI, model: leaf_area_index }
        - { file: LAI_PREV, model: leaf_area_index_prev }

output:
  enabled: true
  directory: "./output/megan3"
  filename_pattern: "cece_megan3_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: MEGAN_ISOP
      attributes:
        units: "kg m-2 s-1"
        long_name: "CECE MEGAN3-class isoprene emission flux"
    - name: MEGAN_TERP
      attributes:
        units: "kg m-2 s-1"
    - name: MEGAN_NO
      attributes:
        units: "kg NO m-2 s-1"
