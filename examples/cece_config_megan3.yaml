# MEGAN standalone configuration template
#
# Selects CECE's C++ 19-class MEGAN3 scheme with CB6 speciation. Its bulk
# activity factors do not yet use the multilayer canopy helpers; this is not
# an independent HEMCO or upstream MEGAN3 parity experiment.
#
# Replace all /path/to values. Input data and gridspec are not bundled.
# Run where data/speciation paths resolve. All streams must match the ordered
# gridspec exactly: lon=-180,-175,...,175; lat=-89,-86,-82,...,86,89.
# Coefficients and default AEFs are illustrative, not a vegetation inventory.
# Every default_aef below is an amount flux in kmol class m-2 s-1.
# See docs/megan.md for megan21 and hemco_3_12_1 replacements for the scheme
# and output sections, and for adding BDSNP before MEGAN3 when soil NO is needed.
# With no preceding soil-NO scheme, MEGAN3 warns and leaves its NO class zero.

driver:
  start_time: "2021-06-20T12:00:00"
  end_time: "2021-06-20T13:00:00"
  timestep_seconds: 3600
  amio_staging_buffer_count: 8
  gridspec_file: "/path/to/hemco_4x5_gridspec.nc"
  grid:
    nx: 72
    ny: 46
    nz: 1

physics_schemes:
  - name: megan3
    language: cpp
    options:
      mechanism_file: data/speciation/spc_cb6.yaml
      speciation_file: data/speciation/map_cb6.yaml
      speciation_dataset: MEGAN
      co2_concentration: 415.0
      co2_method: possell # "possell" or "wilkinson"
      enable_wind_stress: false
      enable_temp_stress: false
      enable_aq_stress: false
      day_of_year: 171 # Scalar effective setting; not inferred from driver time
      emission_classes:
        ISOP:
          ldf: 0.9996
          ct1: 95.0
          cleo: 2.0
          beta: 0.13
          anew: 0.05
          agro: 0.6
          amat: 1.0
          aold: 0.9
          default_aef: 1.0e-9
        MBO:
          ldf: 0.80
          ct1: 80.0
          cleo: 1.83
          beta: 0.13
          anew: 0.05
          agro: 0.6
          amat: 1.0
          aold: 0.9
          default_aef: 2.0e-10
        MT_PINE:
          ldf: 0.10
          ct1: 80.0
          cleo: 1.83
          beta: 0.10
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 3.0e-10
