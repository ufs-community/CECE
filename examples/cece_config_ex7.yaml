# Basic single species example with small grid
driver:
  start_time: "2010-01-01T00:00:00"
  end_time: "2010-01-01T23:00:00"
  timestep_seconds: 3600
  # Optional: write run output to this log file instead of using `> cece.log`.
  # Output is tee'd, so it also still appears on the console.
  log_file: "cece.log"
  amio_worker_threads: 2
  grid:
    grid_name: "F360"
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

meteorology: {}

temporal_profiles:
  diurnal_traffic:
    [
      0.5,
      0.3,
      0.2,
      0.3,
      0.6,
      1.2,
      1.8,
      1.5,
      1.2,
      1.0,
      1.1,
      1.2,
      1.3,
      1.2,
      1.3,
      1.5,
      1.8,
      2.0,
      1.8,
      1.5,
      1.2,
      1.0,
      0.8,
      0.6,
    ]

species:
  nox:
    - field: "HTAP_TRANSPORT_NO"
      operation: "add"
      scale: 1.0
      scale_fields: ["CAMS_HOURLY", "CAMS_WEEKLY", "CAMS_MONTHLY"]
    - field: "HTAP_SHIPS_NO"
      operation: "add"
    - field: "HTAP_RESIDENTIAL_NO"
      operation: "add"
    - field: "HTAP_INDUSTRY_NO"
      operation: "add"
      # CAMS-TEMPO only provides a MONTHLY temporal profile for the industry
      # sector (no hourly/weekly industry weights exist in the dataset).
      scale_fields: ["CAMS_MONTHLY_ind"]
    - field: "HTAP_ENERGY_NO"
      operation: "add"

cece_data:
  streams:
    - name: "HTAP_NO_TRANSPORT"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_TRANSPORT.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "HTAP_TRANSPORT_NO"
    - name: "HTAP_NO_SHIPS"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_SHIPS.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "HTAP_SHIPS_NO"
    - name: "HTAP_NO_RESIDENTIAL"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_RESIDENTIAL.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "HTAP_RESIDENTIAL_NO"
    - name: "HTAP_NO_INDUSTRY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_INDUSTRY.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "HTAP_INDUSTRY_NO"
    - name: "HTAP_NO_ENERGY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_ENERGY.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      cadence: "monthly"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "HTAP_ENERGY_NO"
    - name: "CAMS_HOURLY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/CAMS-TEMPO/v3.1-2021/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_hourly_fixtime.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Discrete hour-of-day profile (24 records): pick the record matching the
      # current simulation hour. Interpolation is not meaningful for of-day
      # weights, so nearest is used regardless of tintalgo.
      cadence: "hourly"
      tintalgo: "nearest"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FH_weekday_tro"
          model: "CAMS_HOURLY"
    - name: "CAMS_WEEKLY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/CAMS-TEMPO/v3.1-2021/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_weekly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Discrete day-of-week profile (7 records): pick the record matching the
      # current simulation day of week. Always nearest.
      cadence: "weekly"
      tintalgo: "nearest"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FW_tro"
          model: "CAMS_WEEKLY"
    - name: "CAMS_MONTHLY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/CAMS-TEMPO/v3.1-2021/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_monthly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      # Continuous monthly climatology (12 records). With tintalgo=linear the
      # value is interpolated to the current day using the mid-month convention
      # (e.g. Jan 1 blends the Dec and Jan records).
      cadence: "monthly"
      tintalgo: "linear"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FM_tro"
          model: "CAMS_MONTHLY"
    - name: "CAMS_MONTHLY_ind"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/CAMS-TEMPO/v3.1-2021/CAMS-GLOB-TEMPO_Glb_0.1x0.1_tmp_weights_v3.1_monthly.nc"
      yearFirst: 2021
      yearLast: 2021
      yearAlign: 2021
      taxmode: "cycle"
      cadence: "monthly"
      tintalgo: "linear"
      mapalgo: "bilinear"
      data_model: "classic"
      variables:
        - file: "FM_ind"
          model: "CAMS_MONTHLY_ind"

diagnostics:
  output_interval_seconds: 3600
  variables: ["nox"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex1_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: nox
      attributes:
        units: "kg m-2 s-1"
        long_name: "nitrogen_oxides_emission_flux"
