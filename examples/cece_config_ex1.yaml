# =====================================================================
# CECE Example 1: Basic Single Species Simulation
# =====================================================================
# This example tests basic emissions remapping capabilities for a
# single chemical species (CO) from a single MACCity anthropogenic
# data stream.
#
# Key Features Tested:
#   - Core-driven single species CO emissions processing.
#   - Guassian global grid (1440x720) with full global lat-lon coverage.
#   - Basic diagnostics output verification.
# =====================================================================
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-01T03:00:00"
  timestep_seconds: 3600
  # Optional: write run output to this log file instead of using `> cece.log`.
  # Output is tee'd, so it also still appears on the console.
  log_file: "cece.log"
  grid:
    # grid_name: "F360"
    nx: 4
    ny: 4
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  co:
    - field: "co"
      operation: "add"
      scale: 1.0

cece_data:
  streams:
    - name: "MACCITY"
      file: "data/MACCity_4x5.nc"
      cadence: "monthly"
      yearAlign: 2020 # Simulation year 2020 aligns to the first file year
      taxmode: "cycle" # Reuse the file's coverage outside its range
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "MACCity"
          model: "co"

diagnostics:
  output_interval: 3600
  variables: ["co"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex1_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: co
      attributes:
        units: "kg m-2 s-1"
        long_name: "carbon_monoxide_emission_flux"
