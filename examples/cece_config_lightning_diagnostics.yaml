driver:
  start_time: "2020-06-20T00:00:00"
  end_time: "2020-06-20T02:00:00"
  timestep_seconds: 3600
  grid:
    nx: 4
    ny: 2
    nz: 3
    lon_min: -1.5
    lon_max: 1.5
    lat_min: -0.5
    lat_max: 0.5

species:
  LIGHTNING_NO: []
  FLASH_RATE: []
  FLASH_DENSITY: []
  NO_PER_FLASH: []
  NO_PRODUCTION: []

physics_schemes:
  - name: lightning
    language: cpp
    refresh_interval_seconds: 3600
    options:
      yield_land: 3.011e26
      yield_ocean: 1.566e26
      flash_rate_coeff: 3.44e-5
      flash_rate_power: 4.9
      flash_rate_time_unit: minutes
      input_mapping:
        cloud_top_height: CLOUD_TOP_HEIGHT
        land_mask: LAND_MASK
        cell_area: CELL_AREA
      output_mapping:
        lightning_nox_emissions: LIGHTNING_NO
        lightning_flash_rate: FLASH_RATE
        lightning_flash_density: FLASH_DENSITY
        lightning_nox_efficiency: NO_PER_FLASH
        lightning_nox_production: NO_PRODUCTION

cece_data:
  streams:
    - name: LIGHTNING_METEOROLOGY
      file: data/lightning/lightning_diagnostics_input.nc
      cadence: stepwise
      mapalgo: bilinear
      data_model: enhanced
      variables:
        - { file: cloud_top_height, model: CLOUD_TOP_HEIGHT }
        - { file: land_mask, model: LAND_MASK }
        - { file: cell_area, model: CELL_AREA }

output:
  enabled: true
  directory: ./cece_output/lightning
  filename_pattern: "lightning_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: LIGHTNING_NO
      attributes:
        units: "kg s-1 cell-1"
        long_name: "lightning NO production distributed across model levels"
    - name: FLASH_RATE
      attributes:
        units: "flashes s-1 cell-1"
        long_name: "column flash rate at level 0; zero at other levels"
    - name: FLASH_DENSITY
      attributes:
        units: "flashes km-2 h-1"
        long_name: "column flash density at level 0; zero at other levels"
    - name: NO_PER_FLASH
      attributes:
        units: "mol flash-1"
        long_name: "mol NO per flash at level 0; NaN without flashes or at other levels"
    - name: NO_PRODUCTION
      attributes:
        units: "kg s-1 cell-1"
        long_name: "column lightning NO production at level 0; zero at other levels"
