# =====================================================================
# CECE Example 3: Minimal Fast Testing Configuration
# =====================================================================
# This example tests the fast standalone core cycle with a minimal,
# low-overhead rectilinear spatial layout.
#
# Key Features Tested:
#   - Fast startup, minimal timing sequence, and debugging loop.
#   - Rectilinear minimal grid (2x2) for instant linter and unit tests.
#   - Basic stream ingestion without timing parameter constraints.
# =====================================================================
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-01T01:00:00"
  timestep_seconds: 3600
  grid:
    nx: 2
    ny: 2
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  co:
    - field: "MACCITY_CO"
      category: "anthropogenic"
      hierarchy: 1
      operation: "add"

cece_data:
  streams:
    - name: "MACCITY_CO"
      file: "/work/data/MACCity_4x5.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "MACCity"
          model: "MACCITY_CO"

diagnostics:
  output_interval_seconds: 3600
  variables: ["co"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex3_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: co
      attributes:
        units: "kg m-2 s-1"
        long_name: "carbon_monoxide_emission_flux"
