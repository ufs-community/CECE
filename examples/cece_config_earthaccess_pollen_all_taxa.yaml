# =====================================================================
# CECE Pollen Example: All Built-in Taxa + Earthaccess MERRA-2
# =====================================================================
# This configuration instantiates every distinct built-in taxon alias.
# pollen_artemisia is a synonym of pollen_mugwort and is intentionally not
# instantiated concurrently. pollen_total is an aggregate tracer and should
# not be summed with the individual taxa.
#
# Required climatology:
#   data/pollen/annual_pollen_production_all_taxa_2025.nc
# with a singleton 2025 time coordinate and, for each TAXON below:
#   TAXON_pannual [grains m-2 yr-1], TAXON_sdoy, TAXON_edoy
#
# Train and include only taxa your observation provider actually supports at
# your sites (docs/pollen.md); remove unsupported taxa rather than filling
# missing climatologies with zero. Ambee, for example, reports juniper and
# cedar merged into cypress (Species.Tree.Cypress/Juniper/Cedar) with no
# separate juniper field, so pollen_cypress and pollen_juniper must not both
# be trained from that same combined Ambee count.
#
# Particle diameter and density defaults are placeholders in this broad
# example. Configure taxon-specific measured values for scientific production.
# =====================================================================

driver:
  start_time: "2025-08-25T00:00:00"
  end_time: "2025-08-26T00:00:00"
  timestep_seconds: 3600
  log_file: "./logs/cece_earthaccess_pollen_all_taxa.log"
  earthaccess_helper: "../scripts/cece_earthaccess_standalone_ingest.py"
  amio_worker_threads: 1
  amio_staging_buffer_count: 8
  grid:
    nx: 576
    ny: 361
    nz: 1
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  POLLEN_MUGWORT_NUM: []
  POLLEN_MUGWORT_MASS: []
  POLLEN_CHENOPOD_NUM: []
  POLLEN_CHENOPOD_MASS: []
  POLLEN_RAGWEED_NUM: []
  POLLEN_RAGWEED_MASS: []
  POLLEN_GRASS_NUM: []
  POLLEN_GRASS_MASS: []
  POLLEN_ALDER_NUM: []
  POLLEN_ALDER_MASS: []
  POLLEN_ASH_NUM: []
  POLLEN_ASH_MASS: []
  POLLEN_BIRCH_NUM: []
  POLLEN_BIRCH_MASS: []
  POLLEN_COTTONWOOD_NUM: []
  POLLEN_COTTONWOOD_MASS: []
  POLLEN_CYPRESS_NUM: []
  POLLEN_CYPRESS_MASS: []
  POLLEN_ELM_NUM: []
  POLLEN_ELM_MASS: []
  POLLEN_HAZEL_NUM: []
  POLLEN_HAZEL_MASS: []
  POLLEN_JUNIPER_NUM: []
  POLLEN_JUNIPER_MASS: []
  POLLEN_MAPLE_NUM: []
  POLLEN_MAPLE_MASS: []
  POLLEN_OAK_NUM: []
  POLLEN_OAK_MASS: []
  POLLEN_OLIVE_NUM: []
  POLLEN_OLIVE_MASS: []
  POLLEN_PINE_NUM: []
  POLLEN_PINE_MASS: []
  POLLEN_PLANE_NUM: []
  POLLEN_PLANE_MASS: []
  POLLEN_NETTLE_NUM: []
  POLLEN_NETTLE_MASS: []
  POLLEN_TOTAL_NUM: []
  POLLEN_TOTAL_MASS: []

# Shared canonical meteorology names are provided by the Earthaccess streams.
# Each taxon maps only its climatology and unique outputs.
physics_schemes:
  - name: pollen_mugwort
    options:
      vegetation_fraction_default: 1.0
      input_mapping:
        annual_pollen_production: MUGWORT_PANNUAL
        season_start_doy: MUGWORT_SDOY
        season_end_doy: MUGWORT_EDOY
      output_mapping:
        pollen_number_emissions: POLLEN_MUGWORT_NUM
        pollen_mass_emissions: POLLEN_MUGWORT_MASS
