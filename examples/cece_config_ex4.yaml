# =====================================================================
# CECE Example 4: Biomass-burning data ingestion
# =====================================================================
# This example demonstrates loading an inventory stream into a species layer.
#
# Key Features Tested:
#   - Inventory stream configuration and species-layer mapping.
#   - 24-hour simulation cycle for full day-night profiling.
# =====================================================================
driver:
  start_time: "2020-01-01T00:00:00"
  end_time: "2020-01-02T00:00:00"
  timestep_seconds: 3600
  grid:
    nx: 6
    ny: 4
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  "no":
    - field: "HTAP_NO"
      operation: "add"

cece_data:
  streams:
    - name: "HTAP_NO"
      file: "/work/data/HTAPv3_NO_0.1x0.1_2018.nc"
      cadence: "monthly"
      yearAlign: 2020 # Simulation year 2020 aligns to the 2018 file year
      taxmode: "extend" # Hold the file's end values outside its coverage
      tintalgo: "linear"
      mapalgo: "consd"
      variables:
        - file: "NO_SHP"
          model: "HTAP_NO"

diagnostics:
  output_interval: 3600
  variables: ["no"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex4_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: "no"
      attributes:
        units: "kg m-2 s-1"
        long_name: "nitrogen_monoxide_emission_flux"
