[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cece-tools"
version = "0.1.0"
description = "Tools and scripts for the CECE (Atmospheric Chemistry Emissions Stacker) component."
requires-python = ">=3.8"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
]
cloud = [
    "earthaccess>=0.12",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "fsspec>=2024.3",
    "s3fs>=2024.3",
]
