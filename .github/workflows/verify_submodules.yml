name: Submodule Verification
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to verify against (default: develop)"
        required: false
        default: "develop"

concurrency:
  group: submodule-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Submodule Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Run Submodule Verification
        env:
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TARGET_BRANCH="${INPUT_TARGET_BRANCH:-${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-develop}}}"
          python3 scripts/verify_submodules.py --target-branch "${TARGET_BRANCH}" --step-summary
