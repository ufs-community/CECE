required_before_reference:
  - Retrieve and SHA256-pin the complete V5 ATBD and record redistribution rights.
  - Verify equation 8 and cloud, temporal and satellite-blending rules against the document and deployed implementation.
  - Obtain species-specific QFED-referenced coefficients, units, satellite, biome and geographic applicability.
  - Verify the exact deployed land-cover source and biome crosswalk; inspect and validate annual IGBP17 class data and source-grid aggregation.
  - Obtain independent input and output scenes with hashes and preapproved numerical tolerances.
  - Verify representative V5 product metadata before implementing or claiming V5 decoding.
blocker: >-
  V5 coefficient and equation transcription, independent reference scenes,
  redistribution rights and numerical approval remain unavailable. V4r0
  product availability does not establish a V5 data or science contract.
