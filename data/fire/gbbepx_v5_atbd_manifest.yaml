candidate_raw_viirs_pair:
  status: metadata_inspected_not_runtime_supported
  source_registry: https://registry.opendata.aws/noaa-jpss/
  selection: >-
    User requested a runtime proxy accepting raw VIIRS inputs. This pair
    was inspected to inform a possible decoder; it is not an output reference
    and no raw-input runtime adapter has been implemented.
  fire:
    source_url: https://noaa-nesdis-n20-pds.s3.amazonaws.com/VIIRS_EFIRE_VIIRSI_EDR/2025/07/01/EFIRE-VIIRSI_v1r3_n20_s202507010000464_e202507010002109_c202507010024494.nc
    content_sha256: fc5b4f8f61eaecd22ea38a0245d2f2249e617e51b4d1a5b63f90f9e8fa64bdaa
    product_version: v1r3
    platform: NOAA-20
    interval_start: "2025-07-01T00:00:46Z"
    interval_end: "2025-07-01T00:02:10Z"
    fire_mask_shape: [1536, 6400]
    number_of_fire_pixels: 0
    frp_variable: FP_FireRadiativePower
    frp_units: MW
    fire_pixel_area_variable: FP_PixelArea
    fire_pixel_area_units: km2
  geolocation:
    source_url: https://noaa-nesdis-n20-pds.s3.amazonaws.com/VIIRS-IMG-GEO-TC/2025/07/01/GITCO_j01_d20250701_t0000464_e0002109_b39465_c20250701001946833000_oeac_ops.h5
    content_sha256: 60cdbd7a8b1b7f034d64294213f1ed992fa2e298d1b6e64a8aa2d8ef5578dd0e
    latitude_path: /All_Data/VIIRS-IMG-GEO-TC_All/Latitude
    longitude_path: /All_Data/VIIRS-IMG-GEO-TC_All/Longitude
    shape: [1536, 6400]
  limitations: >-
    The active-fire mask distinguishes clouds from clear land and water,
    but does not separately label cloud-covered land and water. Pixel area
    is provided for detected fires, not all cloud/clear mask pixels; scan
    geometry, land/water classification and overlap need explicit treatment
    for cloud-adjusted FRP. The user proposed geolocation finite differences
    or VIIRS aggregation geometry and excluding bow-tie-deleted pixels; an
    experimental finite-difference helper exists, but is neither certified
    nor connected to ingestion. The sample has no fire pixels and cannot
    validate FRP decoding. The I-band active-fire ATBD notes that some failed
    FRP retrievals are encoded as zero, so a zero FRP on a detected fire is
    not automatically a valid absence of fire.

methodology:
  direct_viirs_frp: >-
    Search-indexed excerpts say V5 estimates emissions directly from VIIRS FRP
    because two daily VIIRS observations do not determine FRE. It uses
    cloud-adjusted FRP and empirically derived QFED-referenced coefficients,
    rather than a required FRP-to-FRE-to-dry-matter conversion.
  blending: >-
    Excerpts describe separate VIIRS-satellite emission estimates and blending.
    Verify exact equations, ordering, valid-data rules, and whether FRP and
    emission blending use the same policy in the complete ATBD.
  species: >-
    NOAA's product page lists BC, CO, CO2, OC, PM2.5, SO2, NH3, and NOx in
    the 0.1-degree product; verify the exact V5 ATBD and sample variables,
    units, coefficient availability, and grid-specific output set.
  product_page: https://www.ospo.noaa.gov/products/land/gbbepx/index.html

