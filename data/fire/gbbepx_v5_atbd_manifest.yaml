user_supplied_methodology:
  title: GBBEPx Version 5 Algorithm Theoretical Basis & Methodology
  filename: GBBEPx_V5_Methodology_and_Equations.pdf
  content_sha256: 7c3a194a53fd006628d08b77dc52e957b16e1dc588b2759660ffc2d56835d11e
  inspected_at: "2026-11-23"
  pages: 4
  status: candidate_not_independently_verified
  provenance: >-
    User-supplied four-page methodology document. It is not the complete
    2024 V5 ATBD referenced above; its equivalence to the operational V5
    algorithm and coefficients has not been established.
  scope: >-
    Describes direct cloud-adjusted VIIRS FRP conversion, biome and
    continent stratification, valid-sensor averaging and eight species.
    It does not provide the full species-by-continent-by-biome V5
    coefficient table or independent sensor-to-output reference scenes.
  unresolved:
    - >-
      Its continental and biome reference tables reproduce the six-species
      tables on page 25 of the accessible GBBEPx V3.1 ATBD. They do not
      establish the missing V5 biome-specific NH3 and NOx coefficients.
    - >-
      Its coefficient heading equates 10^-9 kg/J with mg/MJ; these differ
      by a factor of 1000. Confirm coefficient units from the V5 source.
    - >-
      It labels class 0 as water, whereas the inspected NOAA VIIRS IGBP17
      file uses 0 as fill and 17 as water. Preserve source-specific missing
      semantics; never silently treat fill as water or valid land.
    - >-
      It describes MODIS land cover, while the inspected candidate is VIIRS.
      Verify the deployed V5 source, crosswalk and aggregation before use.
    - >-
      It gives a ratio as a calibration formula, while indexed excerpts of
      the V5 ATBD describe a regression slope; confirm the regression method,
      cloud edge cases and deployed blending against the full source.

older_algorithm_document:
  version: "3.1"
  source_url: https://www.ospo.noaa.gov/resources/documents/pdf/GBBEPx_ATBD.pdf
  content_sha256: 419652ea3773f586ed1267d09c04efe406d9b9802831e6b3a6fb2211e7722589
  inspected_at: "2026-11-23"
  requested_use: >-
    The user requested using V3 documentation for missing V5 details.
    Treat V3-derived information as a separately identified provisional proxy,
    not as verified V5 coefficients or production science.
  user_supplied_coefficient_scale:
    value_kg_per_joule_per_table_unit: 1.0e-12
    status: user_supplied_not_independently_verified
    notes: >-
      The user specified an omitted 10^-12 kg/J scale for V3.1 Table 2-5.
      The V3.1 table itself does not state that multiplier. The four-page V5
      summary instead states 10^-9 kg/J and contains a conflicting unit
      equivalence; do not describe the user-supplied scale as independently
      verified or apply it to a V5 coefficient table.
  scope: >-
    Older MODIS/VIIRS blended algorithm; not evidence that V5 uses the
    same coefficients, class mapping or correction procedure.
  proxy_limitations:
    - >-
      Table 2-5 provides continental VIIRS coefficients for six species:
      CO2, CO, PM2.5, OC, BC and SO2. It contains neither NH3 nor NOx,
      nor a separate coefficient for each biome.
    - >-
      The table heading declares kg/J but does not state a multiplier.
      Independent confirmation of the user-supplied 10^-12 scale remains
      outstanding.
    - >-
      Sections 2.3.2 and 2.3.3 describe an older VIIRS calibration and
      blending with QFED; tables 1-1 identify 750 m VIIRS input. These do
      not establish the V5 375 m calibration or sensor-only blend.
    - >-
      This document does not supply RAVE ABI/VIIRS fusion, ecoregional
      diurnal reconstruction, the full eleven-species FRE chain, or the
      independent V5 input/output scenes needed by T028-T029 and T041.

