schema_version: 1
production_support: false
policy:
  activation: >-
    Production assets require immutable version, SHA256, documented redistribution
    rights, applicability and independent scientific verification before activation.
    A public URL is not verification or permission to redistribute.
  missing_assets: Fail explicitly; never substitute synthetic data or MEGAN factors.
  references: Relative asset paths resolve against this registry.
  synthetic: >-
    Synthetic fixtures are test-only, with independent arithmetic expectations.
    They do not certify NOAA adapters, algorithms or chemistry targets.
