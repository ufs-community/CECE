other_candidate_surface_type:
  source_manifest: gbbepx_v5_atbd_manifest.yaml
  status: user_selected_not_validated
  notes: >-
    The user selected NOAA NCEI VIIRS AST as the land-cover source. A 2019
    annual IGBP17 file has inspected metadata and a full SHA256 recorded in
    the source manifest. Its year and classes do not establish equivalence
    to the RAVE profile's 2019 MODIS ancillary or its five-class aggregation.
    AST also offers surface-type climatology maps; these are not FRP diurnal
    climatology, burn-duration tables, or EPA ecoregion maps.
  candidate_igbp17_crosswalk:
    forest: [1, 2, 3, 4, 5]
    shrubland: [6, 7]
    savanna: [8, 9]
    grassland: [10, 11]
    cropland: [12, 14]
    unsupported: [13, 15, 16, 17]
    fill_value: 0
    status: semantic_mapping_only_not_deployed_validation
    notes: >-
      Mapping uses the VIIRS class names and the five groups described in
      ATBD section 1.2.1.3. The inspected VIIRS IGBP17 file defines 17 as
      water and 0 as fill, not water. Classes without a documented mapping
      fail explicitly; this does not assert that they are universally
      non-burnable. IGBP20 must not be interpreted as IGBP17. The standalone
      crosswalk is not connected to ancillary ingestion or derivation.

