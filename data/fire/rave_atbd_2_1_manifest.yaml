applicability:
  emissions_factors: CONUS; global extrapolation is not established.
  analysis_grid: "0.03-degree longitude/latitude grid, described as approximately 3 km"
  source_sections: ["1.2.1.3", "2.3.1", "2.3.2"]
  high_latitude: >-
    Section 2.3.1.1.1 describes redistribution to eight neighbors using VIIRS
    weights, but does not specify enough detail to implement and validate the
    procedure. High-latitude operation remains unsupported without a verified
    rule and reference cases.

scientific_review:
  - id: reconstruction_revision
    status: baseline_selected_compatibility_unverified
    evidence: >-
      Li et al. 2022 sections 3.2 and 3.3 describe five-minute CONUS FRP
      reconstruction and eight species. They use 1 hour around observations
      during climatological burning hours and 30 minutes otherwise, and
      contemporaneous sensor pairs within 2.5 minutes. ATBD v2.1 sections
      2.3.1.2, 2.3.1.3 and 2.3.2 describe 10-minute reconstruction and
      integration, 2 hours and 1 hour respectively, and pairs within 5
      minutes. Its climatologies are nevertheless built in five-minute bins.
      The paper's eight-species table does not supply TPM, VOC or CH4.
      Do not combine these revisions as if they were one validated algorithm.
      The user selected ATBD v2.1 as the baseline after these differences were
      presented; the requested VIIRS land-cover substitution still requires
      a distinct identity and validation.
  - id: inconsistent_cloud_threshold
    status: blocked
    evidence: >-
      Section 2.3.1.1.1 says correction is not conducted above 95% cloud
      fraction, while section 2.3.3 says correction is conducted above 95%.
      Resolve against the verified implementation and reference scenes rather
      than choosing a rule by assumption.
  - id: emission_factor_table_caption
    status: blocked
    evidence: >-
      Section 2.3.2 and Table 2 describe eight species but the displayed table
      contains eleven rows. Verify all rows, units and associated deployed
      tables independently before installing production coefficients.
  - id: causal_policy
    status: blocked
    evidence: >-
      Retrospective reconstruction does not establish a causal algorithm.
      An independently verified causal profile is required for causal use.
  - id: user_supplied_rebuild_details
    status: unverified
    evidence: >-
      The user supplied possible retrieval routes and reconstruction details.
      The proposed one-hour and 30-minute long-gap buffers match Li et al.
      2022, not ATBD v2.1, which specifies two hours and one hour.
      EUM v2.2 Table 3-1 describes low quality for large viewing zenith and
      certain solar zenith angles; it does not establish exclusion from
      climatology training. The EUM's detection/VIIRS conditions are quality
      labels, not the proposed training-filter rules. The deployed time basis,
      minimum sample count, exact outlier threshold and DFT settings remain
      unverified. ATBD v2.1 section 1.2.1.3 describes 2019 MODIS, not a
      verified transition to VIIRS AST.

required_assets:
  - id: abi-and-viirs-reference-scenes
    status: blocked
    reason: Independent input scenes, expected results, rights and approved per-variable tolerances are not yet available.
  - id: land-cover-and-ecoregion
    status: blocked
    reason: >-
      Section 1.2.1.3 describes 2019 MODIS land cover aggregated to five
      classes and North American EPA Level I ecoregions. The user selected
      VIIRS AST IGBP17 for land cover; its categorical crosswalk, aggregation
      and profile identity remain to be validated. EPA Level I vector data
      have been inspected as a candidate, but equivalence to the deployed
      RAVE map and its rasterization and ecoregion identifiers is unverified.
  - id: diurnal-and-burn-duration
    status: blocked
    reason: Compatible versioned climatology tables, time basis, coverage and checksums have not been verified.
  - id: observation-geometry-and-quality
    status: blocked
    reason: Compatible parallax, geolocation, persistent-anomaly, cloud and VIIRS pixel-area assets need verification.
  - id: emission-and-scaling-tables
    status: blocked
    reason: Deployed table bytes, units, biome mappings, scaling applicability and independent values need verification.

