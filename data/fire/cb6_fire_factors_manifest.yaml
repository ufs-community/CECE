  special_handling:
    FRP:     {value: 1000000, name: "Fire radiative power",    unit: "MeanFRP_input", notes: "Scaling factor"}

# Speciation Summary
summary:
  total_pm25_species: 17
  total_gas_species: 25
  base_species: ["PM2.5", "CO"]
  
  key_species:
    pm25_largest_contributors:
      - {species: "POC", fraction: 0.4618, name: "Organic carbon"}
      - {species: "PNCOM", fraction: 0.3232, name: "Noncarbon organic"}
      - {species: "PEC", fraction: 0.0949, name: "Elemental carbon"}
    
    voc_largest_contributors:
      - {species: "CO", fraction: 1.0000, name: "Carbon monoxide (reference)"}
      - {species: "CH4", fraction: 0.0092, name: "Methane"}
      - {species: "ALDX", fraction: 0.0030, name: "Higher aldehydes"}
      - {species: "OLE", fraction: 0.0034, name: "Terminal olefins"}
    
    nox_partition:
      - {species: "NO", fraction: 0.0450, ratio: "9:1 NO:NO2"}
      - {species: "NO2", fraction: 0.0050, notes: "Implies ~90% NO, 10% NO2 basis"}

# Dimensional Chain (from RAVE ATBD)
dimensional_chain:
  equation_1: "FRE_MJ = integral(FRP_MW * dt_seconds) / 1,000,000"
  equation_2: "dry_matter_kg = FRE_MJ * combustion_coefficient_kg_per_MJ"
  equation_3: "species_mass_kg = dry_matter_kg * emission_factor_kg_per_kg"
  
  combustion_coefficient:
    value: 0.368
    unit: "kg/MJ"
    source: "RAVE ATBD 2.1 (Wiedinmyer et al. baseline)"
  
  time_integration:
    FRP_units: "MW (megawatts)"
    dt_units: "seconds"
    FRE_units: "MJ (megajoules)"
    result_units: "kg (kilograms)"

# Validation Notes
validation:
  source_confidence: "High"
  factors_officially_sourced: "✅ NOAA-OAR-ARL official AQMv8 configuration"
  cross_reference: "RAVE ATBD 2.1 Table 2 (anticipated match)"
  unit_verification: "✅ KG/M2/S consistent with dimensional chain"
  
  next_steps:
    - "Cross-reference with RAVE ATBD Table 2 when acquired"
    - "Verify sum of PM2.5 factors (should approach 1.0 for complete mass closure)"
    - "Verify sum of CO factors for VOC speciation closure"
    - "Validate against published CB6 fire emissions studies"

# Implementation Notes
implementation:
  applicable_mechanism: "CB6r3"
  use_cases: ["Product mode (uniform/source_resolved/profile)", "Derivation mode"]
  speciation_engine_integration: "Will use cece_speciation_engine with fire-specific profile"
  mapping_file: "To be created as fire_cb6r3_factors.yaml"
  
  notes: >-
    These factors represent NOAA's official CB6 fire speciation
    for RAVE and GBBEPx products. They map raw fire emissions
    (PM2.5 and CO from RAVE/GBBEPx) to CB6 lumped chemical species.
    
    The factors are expressed as mass fractions of the base species
    (PM2.5 or CO), enabling flexible remapping when input data is
    available in different forms (total PM2.5, constituent aerosols, etc.).

