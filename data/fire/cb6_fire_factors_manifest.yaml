# CB6 Fire Emission Factors Manifest
# T018 Chemistry Speciation for Fire Emissions
# Source: NOAA-OAR-ARL UFS-SRWeather AQMv8_p2 aqm.rc

schema_version: 1
investigation_complete: true
factors_verified: true
verification_date: "2026-11-20"

chemical_mechanism: "CB6"
mechanism_version: "r3"
fire_speciation_basis: "NOAA RAVE/GBBEPx PM2.5 and CO emissions"

source_reference:
  repository: "https://github.com/noaa-oar-arl/ufs-srweather-app"
  branch: "feature/aqmv8_p2"
  file: "parm/aqm.rc"
  line_range: [290, 333]
  accessed_date: "2026-11-20"

