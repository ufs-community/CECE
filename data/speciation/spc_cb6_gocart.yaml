# CB6_GOCART Sea Salt Species Definition (MICM/OpenAtmos format)
#
# Combined mechanism file: the 36 CB6 gas-phase species plus the GOCART
# 5 aerosol size bins. Gas species carry only molecular weight; aerosol
# bins additionally carry size-bin properties (density and dry-radius bounds).
# This single file serves both the gas-phase speciation (MEGAN3) and the
# aerosol schemes (GEOS-12 sea salt).
#
# References:
#   - Yarwood et al. (2010) CB6 mechanism; CMAQ MEGAN3 SPC_CB6AE7.EXT
#   - GOCART sea salt size bins
