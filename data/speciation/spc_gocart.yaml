# GOCART Species Definition (MICM/OpenAtmos format)
#
# Mechanism file: the GOCART 5 aerosol size bins.  Aerosol
# bins carry size-bin properties (density and dry-radius bounds).
# This single file serves the GOCART aerosol schemes (GEOS-12 sea salt).
#
# References:
#   - GOCART sea salt size bins
name: GOCART
species:
  #may add gas phase in the future
  # --- GOCART sea salt aerosol size bins (5 dry-radius bins) ---
  - name: seas1
    molecular weight [kg mol-1]: 0.05844
    is_aerosol: true
    density [kg m-3]: 2200.0
    lower_radius [um]: 0.03
    upper_radius [um]: 0.1
    effective_radius [um]: 0.079
