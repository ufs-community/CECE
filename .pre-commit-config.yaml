repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # C++ formatting via clang-format (uses .clang-format in repo root)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v23.1.3"
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      - id: ruff-check
        args: [--fix, --preview]
      - id: ruff-format
        args: [--preview]
        exclude_types: [markdown]

  # CMake formatting
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: "0.29.2"
    hooks:
      - id: gersemi
        # --definitions teaches gersemi the project's own CMake functions
        # (cece_add_gtest, cece_register_dep, ...) so it formats their keyword
        # arguments and stops warning about unknown commands. It takes a list of
        # paths, so it must precede another option: pre-commit appends the files
        # to format after the last argument.
        args:
          [
            --definitions,
            cmake,
            CMakeLists.txt,
            tests/CMakeLists.txt,
            --in-place,
            --indent=2,
            --line-length=100,
          ]

  # YAML formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.9"
    hooks:
      - id: prettier
        types_or: [yaml]

  - repo: local
    hooks:
      - id: codeowners-core-team
        name: CODEOWNERS lines include the core team
        description: Every non-comment line of .github/CODEOWNERS must list @ufs-community/chem-core-team.
        language: pygrep
        files: ^\.github/CODEOWNERS$
        entry: ^(?!\s*(#|$))(?!.*@ufs-community/chem-core-team).*$

      - id: validate-cece-config
        name: Validate CECE YAML configs and Markdown
        entry: python scripts/validate_cece_config.py
        language: python
        additional_dependencies: [PyYAML]
        files: ^(examples/.*\.ya?ml|scripts/examples/.*\.ya?ml|tests/(data/)?[^/]*\.ya?ml|README\.md|docs/.*\.md)$

      - id: symilar-yaml
        name: symilar-yaml
        description: Check for code duplication in yaml
        verbose: true
        language: python
        additional_dependencies: ["pylint"]
        entry: symilar
        types_or: ["yaml"]
        require_serial: true
        args: ["--duplicates", "55", "--ignore-comments"]
        stages: [manual]
      - id: symilar-bash
        name: symilar-bash
        description: Check for code duplication in bash
        verbose: true
        language: python
        additional_dependencies: ["pylint"]
        entry: symilar
        types_or: ["shell"]
        require_serial: true
        args: ["--duplicates", "5", "--ignore-comments"]
        stages: [manual]
      - id: symilar-python
        name: symilar-python
        description: Check for code duplication in python
        verbose: true
        language: python
        additional_dependencies: ["pylint"]
        entry: symilar
        types: ["python"]
        require_serial: true
        args: ["--duplicates", "10", "--ignore-comments", "--ignore-signatures"]
        stages: [manual]
      - id: symilar-cpp
        name: symilar-cpp
        description: Check for code duplication in C/C++
        verbose: true
        language: python
        additional_dependencies: ["pylint"]
        entry: symilar
        types_or: ["c", "c++"]
        require_serial: true
        args: ["--duplicates", "20", "--ignore-comments"]
        stages: [manual]
      - id: symilar-fortran
        name: symilar-fortran
        description: Check for code duplication in Fortran
        verbose: true
        language: python
        additional_dependencies: ["pylint"]
        entry: symilar
        types_or: ["fortran"]
        require_serial: true
        args: ["--duplicates", "10", "--ignore-comments"]
        stages: [manual]
