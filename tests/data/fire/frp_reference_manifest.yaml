schema_version: 1
status: blocked
production_acceptance: false
purpose: >-
  Tracks independent NOAA ABI/VIIRS reference scenes and approved tolerances
  required for derivation acceptance. Existing RAVE product crops and synthetic
  arithmetic fixtures are not independent sensor-to-emissions references.
algorithm_manifest: ../../../data/fire/rave_atbd_2_1_manifest.yaml
reference_scenes: []
candidate_output_dataset:
  record_url: https://zenodo.org/records/17362980
  description: >-
    NOAA/SDSU reprocessed RAVE v2.0 daily files with hourly FRP, FRE and
    emissions, plus IGBP, EPA Level I ecoregions and grid area. These are
    candidate expected products, not independently paired sensor input scenes.
  license: CC-BY-4.0
  archive:
    name: RAVE_V2_2020.zip
    size_bytes: 308847336
    publisher_md5: ff0b4290cdaad6d104cf02dc3478e389
  verification: >-
    Record metadata and one nested daily file were inspected using HTTP byte
    ranges; the complete archive was not downloaded or independently hashed.
    Compatibility, exact ancillary versions, sensor inputs and independent
    reference pairs remain unverified.
  inspected_daily_output:
    archive_member: 2020/RAVE-HrlyEmiss-3km_v2r0_blend_s202008010000000_e202008012359590_c202408081607500.tar.gz
    archive_member_size_bytes: 4333966
    archive_member_sha256: 6de8ad54b9ad015bcf11df34379be2fd102e81b507d9ab093293f2f58856030a
    netcdf_member: RAVE-HrlyEmiss-3km_v2r0_blend_s202008010000000_e202008012359590_c202408081607500.nc
    netcdf_size_bytes: 46788584
    netcdf_sha256: 602e13755036e9041eec43e3eed86aef1edc118d3d3fef8d70c3e2ecd9af9a03
    algorithm_version: v2r0
    interval: 24 hourly outputs on 2020-08-01 UTC
    grid_shape: [2610, 6240]
    observations: >-
      Metadata describes 0.03-degree latitude/longitude spacing. The file
      contains hourly FRP_MEAN (MW), FRE (MJ), eleven unscaled and eleven
      scaled species (kg), QA, prediction and cloud fraction, and a
      two-dimensional land_cover field. No ecoregion variable was found in
      this file. The land_cover flag meanings are water_snow_ice, forest,
      shrubland, savanna, grassland and cropland, for values 0 through 5;
      these are RAVE output categories, not IGBP17 IDs. A California-window
      search found positive FRE values. One forest cell at zero-based
      [time, y, x] = [0, 1080, 3192] approximately agrees, for each of the
      eleven unscaled species, with FRE times 0.368 kg/MJ and the ATBD forest
      mean factors. This exploratory comparison used displayed rounded values
      and is not an approved numerical acceptance test. Source sensor scenes,
      individual land-cover values against source maps and v2.1 algorithm
      compatibility remain unverified. The inspected files were not retained.
required_before_comparison:
  - Immutable ABI and VIIRS input identities, geometry, QA, times, coverage and hashes.
  - Compatible algorithm, ancillary and expected-output identities and hashes.
  - Documented redistribution rights and geographic applicability.
  - Independently sourced expected energy and eleven-species outputs.
  - Per-variable units and numerical tolerances approved before comparison.
  - Explicit reconstruction, cutoff, age, overlap and high-latitude applicability.
blocker: >-
  No independent, compatible sensor scenes and approved numerical tolerances
  have been obtained. Do not populate expectations from CECE outputs or claim
  NOAA scientific acceptance.
