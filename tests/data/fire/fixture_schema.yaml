$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/drnimbusrain/CECE/tests/data/fire/fixture_schema.yaml
title: CECE fire reference fixture
type: object
additionalProperties: false
required:
  [
    schema_version,
    fixture_id,
    kind,
    production_use,
    provenance,
    inputs,
    expected,
  ]
properties:
  schema_version:
    const: 1
  fixture_id:
    type: string
    minLength: 1
  kind:
    enum: [synthetic, scientific_reference]
  production_use:
    type: boolean
  provenance:
    type: object
    additionalProperties: false
    required: [reference, version, redistribution, independent_reference]
    properties:
      reference: { type: string, minLength: 1 }
      version: { type: string, minLength: 1 }
      content_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      redistribution:
        type: object
        additionalProperties: false
        required: [permitted, basis]
        properties:
          permitted: { type: boolean }
          basis: { type: string, minLength: 1 }
      independent_reference: { type: string, minLength: 1 }
  inputs:
    type: object
    minProperties: 1
  expected:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        [
          quantity,
          units,
          values,
          method,
          relative_tolerance,
          zero_absolute_tolerance,
        ]
      properties:
        quantity: { type: string, minLength: 1 }
        units: { type: string, minLength: 1 }
        values:
          type: array
          minItems: 1
          items: { type: number }
        method: { type: string, minLength: 1 }
        relative_tolerance: { type: number, minimum: 0, maximum: 0.000001 }
        zero_absolute_tolerance:
          { type: number, minimum: 0, maximum: 0.000000000001 }
allOf:
  - if:
      properties:
        kind: { const: synthetic }
    then:
      properties:
        production_use: { const: false }
  - if:
      properties:
        kind: { const: scientific_reference }
    then:
      properties:
        provenance:
          required: [content_sha256]
